[project]
name = "modelshare"
version = "0.1.0"
description = "OpenRouter spend and token share by model maker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FURB", "PLW"]
ignore = ["BLE001", "S110", "PLW0602", "PLW0603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
